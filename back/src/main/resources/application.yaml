ktor:
  application:
    modules:
      - com.hugin_munin.api.ApplicationKt.module
  deployment:
    port: 8080
    host: 0.0.0.0

database:
  driver: ${DB_DRIVER:org.postgresql.Driver}
  url: ${DB_URL:jdbc:postgresql://localhost:5432/hugin_munin}
  user: ${DB_USER:postgres}
  password: ${DB_PASSWORD:}
  maxPoolSize: ${DB_MAX_POOL_SIZE:3}