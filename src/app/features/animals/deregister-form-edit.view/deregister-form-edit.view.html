<div class="main-content">
    <header class="main-header">
        <div class="page-name">
            <nav class="breadcrumb-nav">
                <a routerLink="/animals" class="animals">Animales</a>
                <span><mat-icon>keyboard_arrow_right</mat-icon></span>
                <a>Editar baja de ejemplar</a>
            </nav>
            <h1>Editar baja de ejemplar</h1>
        </div>
    </header>

    <div *ngIf="isLoading" style="text-align: center; padding: 40px; font-family: 'Poppins';">
        <p>Cargando información...</p>
    </div>

    <div *ngIf="error && !isLoading" style="text-align: center; padding: 40px; font-family: 'Poppins'; color: #c00;">
        <mat-icon style="font-size: 48px;">error_outline</mat-icon>
        <p>{{ error }}</p>
        <a routerLink="/animals" style="color: #0066cc;">Volver a la lista</a>
    </div>

    <form *ngIf="!isLoading && !error && registroBaja" id="editDeregisterSpecimen" class="form"
        (submit)="onSubmit($event)">
        <section class="form-section">
            <header class="form-section-header">
                <button #toggleBtn type="button" class="toggle-btn" aria-expanded="true"
                    data-target="identificacion_datos_ejemplar" (click)="toggleSection($event, 0)">
                    <span class="toggle-icon"><mat-icon>keyboard_arrow_down</mat-icon></span>
                    <h2>Identificación y datos del ejemplar</h2>
                </button>
            </header>
            <div #sectionBody class="form-section-body showed" id="identificacion_datos_ejemplar">
                <div class="disabled-group">
                    <label for="NI_animal">Número de inventario:</label>
                    <input type="text" id="NI_animal" name="NI_animal" [value]="registroBaja.numInventario" disabled>
                </div>
                <div class="disabled-group">
                    <label for="genero">Género:</label>
                    <input type="text" id="genero" name="genero" [value]="registroBaja.genero" disabled>
                </div>
                <div class="disabled-group">
                    <label for="especie">Especie:</label>
                    <input type="text" id="especie" name="especie" [value]="registroBaja.especieNombre" disabled>
                </div>
            </div>
        </section>

        <section class="form-section">
            <header class="form-section-header">
                <button #toggleBtn type="button" class="toggle-btn" aria-expanded="false" data-target="datos_baja"
                    (click)="toggleSection($event, 1)">
                    <span class="toggle-icon"><mat-icon>keyboard_arrow_down</mat-icon></span>
                    <h2>Datos de la baja</h2>
                </button>
            </header>
            <div #sectionBody class="form-section-body" id="datos_baja">
                <div class="form-group">
                    <label for="fecha_baja">Fecha de la baja:</label>
                    <input type="date" id="fecha_baja" name="fecha_baja" required [value]="registroBaja.fechaBaja"
                        (blur)="onFieldBlur($event)" (input)="onFieldInput($event)">
                </div>
                <div class="form-group">
                    <label for="causa_baja">Causa de la baja:</label>
                    <select id="causa_baja" name="causa_baja" required (blur)="onFieldBlur($event)"
                        (change)="onFieldInput($event)">
                        <option *ngFor="let causa of causasBaja" [value]="causa.id"
                            [selected]="causa.id === registroBaja.causaBajaId">
                            {{ causa.nombreCausaBaja }}
                        </option>
                    </select>
                </div>
            </div>
        </section>

        <section class="form-section">
            <header class="form-section-header">
                <button #toggleBtn type="button" class="toggle-btn" aria-expanded="false"
                    data-target="informacion_descriptiva" (click)="toggleSection($event, 2)">
                    <span class="toggle-icon"><mat-icon>keyboard_arrow_down</mat-icon></span>
                    <h2>Información descriptiva</h2>
                </button>
            </header>
            <div #sectionBody class="form-section-body" id="informacion_descriptiva">
                <div class="form-group form-notes">
                    <label for="observaciones_baja">Observaciones de baja:</label>
                    <textarea id="observaciones_baja" name="observaciones_baja" rows="4"
                        placeholder="Motivo detallado de la baja, condiciones del animal, destino, etc."
                        [value]="registroBaja.observacion || ''" (blur)="onFieldBlur($event)"
                        (input)="onFieldInput($event)">
                    </textarea>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <button type="submit" class="btn btn-submit" id="submitBtn">
                Guardar cambios
            </button>
            <a routerLink="/animals" class="btn-reset">
                Cancelar
            </a>
        </div>
    </form>
</div>
